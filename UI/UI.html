        updateFetchAllControls();
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function attachItemHandlers() {
        el.itemsContainer.querySelectorAll(".item").forEach((node) => {
          node.addEventListener("click", () => {
            selectItemByKey(node.dataset.key, { focusContainer: true });
          });
        });

        el.itemsContainer
          .querySelectorAll(".item-select")
          .forEach((checkbox) => {
            checkbox.addEventListener("click", (event) => {
              event.stopPropagation();
            });
            checkbox.addEventListener("change", (event) => {
              event.stopPropagation();
              const key = checkbox.dataset.key;
              if (!key) return;
              if (checkbox.checked) {
                state.selectedItemKeys.add(key);
              } else {
                state.selectedItemKeys.delete(key);
              }
              updateFetchAllControls();
            });
          });
      }

      // ── IndexedDB poster cache (persists across sessions) ──────────────────
      const POSTER_DB_NAME = "MoviePosterCache_v1";
      const POSTER_STORE = "posters";
      let _posterDb = null;

      function openPosterDb() {
        if (_posterDb) return Promise.resolve(_posterDb);
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(POSTER_DB_NAME, 1);
          req.onupgradeneeded = (e) =>
            e.target.result.createObjectStore(POSTER_STORE);
          req.onsuccess = (e) => {
            _posterDb = e.target.result;
            resolve(_posterDb);
          };
          req.onerror = (e) => reject(e.target.error);
        });
      }

      async function dbGetPoster(url) {
        try {
          const db = await openPosterDb();
          return await new Promise((resolve, reject) => {
            const req = db
              .transaction(POSTER_STORE, "readonly")
              .objectStore(POSTER_STORE)
              .get(url);
            req.onsuccess = (e) => resolve(e.target.result ?? null);
            req.onerror = (e) => reject(e.target.error);
          });
        } catch {
          return null;
        }
      }

      async function dbSavePoster(url, blob) {
        try {
          const db = await openPosterDb();
          await new Promise((resolve, reject) => {
            const req = db
              .transaction(POSTER_STORE, "readwrite")
              .objectStore(POSTER_STORE)
              .put(blob, url);
            req.onsuccess = () => resolve();
            req.onerror = (e) => reject(e.target.error);
          });
        } catch {
          /* ignore write errors */
        }
      }

      /** Load posters for all visible grid items in parallel. */
      function loadGridPosters() {
        const placeholders = el.itemsContainer.querySelectorAll(
          ".grid-poster-wrap [data-poster-url], .grid-poster-wrap [data-imdb-id]",
        );
        placeholders.forEach((placeholder) => {
          const url = placeholder.dataset.posterUrl;
          const imdbId = placeholder.dataset.imdbId || "";
          if (url || imdbId) loadPosterIntoElement(url, placeholder, imdbId);
        });
      }

      /** Load posters for all visible list items in parallel. */
      function loadListPosters() {
        const placeholders = el.itemsContainer.querySelectorAll(
          ".list-poster-wrap [data-poster-url], .list-poster-wrap [data-imdb-id]",
        );
        placeholders.forEach((placeholder) => {
          const url = placeholder.dataset.posterUrl;
          const imdbId = placeholder.dataset.imdbId || "";
          if (url || imdbId) loadPosterIntoElement(url, placeholder, imdbId);
        });
      }

      /** Search for poster URL by IMDb ID from public Cinemeta endpoint. */
      async function searchImdbPoster(imdbId) {
        try {
          const resp = await fetch(
            `https://v3-cinemeta.strem.io/meta/movie/${encodeURIComponent(imdbId)}.json`,
          );
          if (!resp.ok) return "";
          const data = await resp.json();
          const url = normalize(data?.meta?.poster || "");
          if (/^https?:\/\//i.test(url)) return url;
        } catch {}
        return "";
      }

      /** Fetch/cache a poster and replace the placeholder element with an <img>. */
      async function loadPosterIntoElement(
        posterUrl,
        placeholder,
        imdbId = "",
      ) {
        const posterClass = placeholder.classList.contains("list-poster")
          ? "list-poster"
          : "grid-poster";
        let hadCorsError = false;
        const noPosterLabel = t("poster.noPoster");
        const corsErrorLabel = t("poster.corsError");

        const looksLikeCorsError = (error) => {
          const message = String(error?.message || error || "").toLowerCase();
          return (
            message.includes("cors") ||
            message.includes("failed to fetch") ||
            message.includes("networkerror")
          );
        };

        const setPlaceholder = (text) => {
          if (!placeholder.isConnected) return;
          const label =
            posterClass === "list-poster" && text === corsErrorLabel
              ? corsErrorLabel.replace(" ", "<br/>")
              : text;
          placeholder.outerHTML = `<div class="${posterClass} placeholder">${label}</div>`;
        };

        const setImg = (src) => {
          if (!placeholder.isConnected) return;
          const img = document.createElement("img");
          img.className = posterClass;
          img.src = src;
          img.onerror = () => {
            if (!img.isConnected) return;
            const label = hadCorsError ? corsErrorLabel : noPosterLabel;
            const fallback =
              posterClass === "list-poster" && label === corsErrorLabel
                ? corsErrorLabel.replace(" ", "<br/>")
                : label;
            img.outerHTML = `<div class="${posterClass} placeholder">${fallback}</div>`;
          };
          placeholder.replaceWith(img);
        };

        // 1. Session memory
        if (posterUrl && state.posterObjectUrls.has(posterUrl)) {
          setImg(state.posterObjectUrls.get(posterUrl));
          return;
        }

        // 2. IndexedDB
        if (posterUrl) {
          const cached = await dbGetPoster(posterUrl);
          if (cached) {
            const objUrl = URL.createObjectURL(cached);
            state.posterObjectUrls.set(posterUrl, objUrl);
            setImg(objUrl);
            return;
          }
        }

        // 3. Network → save → display (if posterUrl exists)
        if (posterUrl) {
          try {
            const resp = await fetch(posterUrl, { mode: "cors" });
            if (!resp.ok) throw new Error("HTTP " + resp.status);
            const blob = await resp.blob();
            await dbSavePoster(posterUrl, blob);
            const objUrl = URL.createObjectURL(blob);
            state.posterObjectUrls.set(posterUrl, objUrl);
            setImg(objUrl);
            return;
          } catch (error) {
            if (looksLikeCorsError(error)) hadCorsError = true;
          }
        }

        // 4. Fallback: try IMDb search if imdbId available
        if (imdbId) {
          try {
            const imdbUrl = await searchImdbPoster(imdbId);
            if (imdbUrl) {
              setImg(imdbUrl);
              return;
            }
          } catch {}
        }

        // 5. Last resort: direct poster URL (browser may still render for display)
        if (posterUrl) {
          setImg(posterUrl);
        } else {
          // No poster found
          setPlaceholder(noPosterLabel);
        }
      }

      /**
       * Load a poster for a given URL and display it inside #posterWrap
       * only if the user hasn't switched to a different item meanwhile.
       * Priority: session memory → IndexedDB → network → direct <img> fallback
       */
      async function loadAndCachePoster(posterUrl, targetKey, imdbId = "") {
        if (!posterUrl && !imdbId) return;

        const setWrap = (html) => {
          if (state.selectedKey !== targetKey) return;
          const wrap = document.getElementById("posterWrap");
          if (wrap) wrap.outerHTML = html;
        };

        // 1. Session memory hit
        if (posterUrl && state.posterObjectUrls.has(posterUrl)) {
          setWrap(
            `<img class="poster" src="${state.posterObjectUrls.get(posterUrl)}" alt="poster" />`,
          );
          return;
        }

        // 2. IndexedDB cache hit
        if (posterUrl) {
          const cachedBlob = await dbGetPoster(posterUrl);
          if (cachedBlob) {
            const objUrl = URL.createObjectURL(cachedBlob);
            state.posterObjectUrls.set(posterUrl, objUrl);
            setWrap(`<img class="poster" src="${objUrl}" alt="poster" />`);
            return;
          }
        }

        // 3. Network fetch → save to IndexedDB → display
        if (posterUrl) {
          try {
            const resp = await fetch(posterUrl, { mode: "cors" });
            if (!resp.ok) throw new Error("HTTP " + resp.status);
            const blob = await resp.blob();
            await dbSavePoster(posterUrl, blob);
            const objUrl = URL.createObjectURL(blob);
            state.posterObjectUrls.set(posterUrl, objUrl);
            setWrap(`<img class="poster" src="${objUrl}" alt="poster" />`);
            return;
          } catch {
            // ignore and continue to imdb fallback
          }
        }

        if (imdbId) {
          const imdbPosterUrl = await searchImdbPoster(imdbId);
          if (imdbPosterUrl) {
            setWrap(
              `<img class="poster" src="${escapeHtml(imdbPosterUrl)}" alt="poster" />`,
            );
            return;
          }
        }

        if (posterUrl) {
          setWrap(`<img class="poster" src="${escapeHtml(posterUrl)}" alt="poster"
					onerror="this.outerHTML='<div class=\'poster placeholder\'>${escapeHtml(t("poster.noPoster"))}</div>'" />`);
        } else {
          setWrap(
            `<div id="posterWrap" class="poster placeholder">${escapeHtml(t("poster.noPoster"))}</div>`,
          );
        }
      }

      async function fetchLatestMetadataForItem(
        item,
        statusEl = null,
        options = {},
      ) {
        const {
          persistChanges = true,
          refreshUi = true,
          manageSuppressPageReset = true,
          externalPageLock = null,
        } = options;
        const pageLock = externalPageLock || beginPageLock();
        const ownsPageLock = !externalPageLock;
        const imdbId = normalize(item.imdbId);
        const isSeriesItem = item.sheetType === "series";
        const seriesTitleFromFilename = isSeriesItem
          ? extractSeriesTitleFromFilename(item.filename)
          : "";
        const fallbackTitle = normalize(item.title) || normalize(item.filename);
        const fallbackYear = normalize(item.year);

        if (!imdbId && !normalize(item.filename)) {
          if (ownsPageLock) endPageLock(pageLock);
          throw new Error(t("fetch.missingInput"));
        }

        if (statusEl) {
          statusEl.textContent = imdbId
            ? t("fetch.fetchingOmdb")
            : t("fetch.fetchingFor", {
                title: fallbackTitle,
                yearSuffix: formatYearSuffix(fallbackYear),
              });
        }

        try {
          if (manageSuppressPageReset) state.suppressNextPageReset = true;
          const omdbResult = await requestBackend("fetchOmdbMetadata", {
            imdbId,
            filename: item.filename,
            title: item.title,
            year: item.year,
            type: isSeriesItem ? "series" : undefined,
            seriesTitleFromFilename: isSeriesItem ? seriesTitleFromFilename : undefined,
          });
          const query = omdbResult?.query || {};
          const queryTitle = normalize(query.title || "");
          const queryYear = normalize(query.year || "");
          const omdb = omdbResult?.omdb || omdbResult;
          applyOmdbToItem(item, omdb);
          if (statusEl)
            statusEl.textContent = imdbId
              ? t("fetch.savingWithId", { imdbId })
              : t("fetch.savingFor", {
                  title: queryTitle,
                  yearSuffix: formatYearSuffix(queryYear),
                });
          if (persistChanges) {
            await saveWorkbookToFile({
              quiet: true,
              refreshDetails: false,
              exitEditMode: false,
              preservedPage: pageLock.page,
              preservedSelection: pageLock.selectedKey,
            });
          }
          restorePageLock(pageLock);
          if (statusEl) statusEl.textContent = t("fetch.refreshed");
          if (refreshUi) {
            refreshSelectedItemCard(item);
            renderDetails();
          }
        } finally {
          if (refreshUi) {
            setTimeout(() => {
              restorePageLock(pageLock);
              render();
              renderDetails();
              if (ownsPageLock) endPageLock(pageLock);
            }, 0);
          } else {
            restorePageLock(pageLock);
            if (ownsPageLock) endPageLock(pageLock);
          }
          if (manageSuppressPageReset) {
            setTimeout(() => {
              state.suppressNextPageReset = false;
            }, 0);
          }
        }
      }

      function wireMetadataActions(item) {
        const fetchBtn = document.getElementById("fetchMetadataBtn");
        const toggleBtn = document.getElementById("toggleMetadataBtn");
        const imdbInput = document.getElementById("metadataImdbInput");
        const statusEl = document.getElementById("metadataStatus");

        if (toggleBtn) {
          toggleBtn.addEventListener("click", () => {
            state.isMetadataCollapsed = !state.isMetadataCollapsed;
            renderDetails();
          });
        }

        if (fetchBtn) {
          fetchBtn.addEventListener("click", async () => {
            const inputImdb = normalize(imdbInput?.value || "");
            if (inputImdb && inputImdb !== normalize(item.imdbId)) {
              item.imdbId = inputImdb;

            try {
              await fetchLatestMetadataForItem(item, statusEl);
            } catch (error) {
              if (statusEl)
                statusEl.textContent = error.message || t("fetch.failed");
            }
          });
        }
      }

      // ── Add New Item helpers ───────────────────────────────────────────────

      function inferQualityFromSourceName(sourceName) {
        const value = normalize(sourceName);
        return /\[X5\]/i.test(value) ? "hevc" : "x264";
      }

      function parseMovieFilenameForForm(filename) {
        if (!filename)
          return { title: "", year: "", resolution: "", quality: "" };
        const basename =
          filename.replace(/\\/g, "/").split("/").pop() || filename;
        const nameNoExt = basename.replace(/\.[^.[]+$/, "");
        const bracketIdx = nameNoExt.indexOf("[");
        let titlePart =
          bracketIdx >= 0 ? nameNoExt.slice(0, bracketIdx) : nameNoExt;
        titlePart = titlePart.replace(/\./g, " ").replace(/\s+/g, " ").trim();
        const allBrackets = [...nameNoExt.matchAll(/\[([^\]]*)\]/g)];
        const year = allBrackets.length >= 1 ? allBrackets[0][1].trim() : "";
        const resolution =
          allBrackets.length >= 2 ? allBrackets[1][1].trim() : "";
        const quality = inferQualityFromSourceName(nameNoExt);
        return { title: titlePart, year, resolution, quality };
      }

      function parseSeriesFolderForForm(folderName) {
        const raw = normalize(folderName);
        if (!raw)
          return {
            title: "",
            season: "",
            resolution: "",
            quality: "",
            storageSize: "",
          };

        const name = raw.replace(/[\\/]+/g, " ").trim();
        const seasonMatch = name.match(/S\d{1,2}/i);
        const resolutionMatch = name.match(/(?:\(|\[)?\s*(2160p|1080p|720p|480p|360p|SD)\s*(?:\)|\])?/i);
        const quality = inferQualityFromSourceName(name);
        const storageSizeMatch = name.match(/(?:\(|\[)?\s*(\d+(?:\.\d+)?)\s*(TB|TIB|GB|GIB|MB|MIB)\s*(?:\)|\])?/i);

        let titlePart = name;
        if (seasonMatch && seasonMatch.index >= 0) {
          titlePart = name.slice(0, seasonMatch.index);
        } else {
          const idx = name.indexOf("(");
          if (idx > 0) titlePart = name.slice(0, idx);
        }

        const title = titlePart.replace(/[._-]+/g, " ").replace(/\s+/g, " ").trim();
        const season = seasonMatch ? seasonMatch[0].toUpperCase() : "";
        const resolution = resolutionMatch ? resolutionMatch[1] : "";

        let storageSize = "";
        if (storageSizeMatch) {
          const amount = Number(storageSizeMatch[1]);
          const unit = (storageSizeMatch[2] || "").toUpperCase();
          if (!Number.isNaN(amount) && amount > 0) {
            if (unit === "TB" || unit === "TIB") {
              storageSize = (amount * 1024).toFixed(2).replace(/\.00$/, "").replace(/(\.\d)0$/, "$1");
            } else if (unit === "GB" || unit === "GIB") {
              storageSize = amount.toFixed(2).replace(/\.00$/, "").replace(/(\.\d)0$/, "$1");
            } else {
              storageSize = Math.round(amount) + " MB";
            }
          }
        }

        return {
          title,
          season,
          resolution,
          quality,
          storageSize,
        };
      }

      function renderAddNewPanel() {
        const isSeries = state.activeTab === "series";
        const movieTypeOpts = ["EN", "HN", "AN", "FN", "RG", "DC", "3D"]
          .map((o) => `<option value="${o}">${o}</option>`)
          .join("");
        const resolutionOpts = ["", "1080p", "720p", "2160p", "SD"]
          .map((o) => `<option value="${o}">${o || "\u2014"}</option>`)
          .join("");
        const qualityOpts = `<option value="">\u2014</option><option value="hevc">hevc</option><option value="x264">x264</option>`;

      function wireAddNewPanel() {
        const isSeries = state.activeTab === "series";
        const browseBtn = document.getElementById("addNewBrowseBtn");
        const fileBrowse = document.getElementById("addNewFileBrowse");
        const filenameInput = document.getElementById("addNewFilename");
        const titleInput = document.getElementById("addNewTitle");
        const yearInput = document.getElementById("addNewYear");
        const seasonInput = document.getElementById("addNewSeason");
        const movieTypeSel = document.getElementById("addNewMovieType");
        const resolutionSel = document.getElementById("addNewResolution");
        const qualitySel = document.getElementById("addNewQuality");
        const storageCaseSel = document.getElementById("addNewStorageCase");
        const storageHddSel = document.getElementById("addNewStorageHdd");
        const storageSizeInput = document.getElementById("addNewStorageSize");
        const saveBtn = document.getElementById("addNewSaveBtn");
        const cancelBtn = document.getElementById("addNewCancelBtn");
        const statusEl = document.getElementById("addNewStatus");

        function applyParsed(sourceName, force = false) {
          const parsed = isSeries
            ? parseSeriesFolderForForm(sourceName)
            : parseMovieFilenameForForm(sourceName);
          if (force || !titleInput.value) titleInput.value = parsed.title || "";
          if (!isSeries && yearInput && (force || !yearInput.value)) {
            yearInput.value = parsed.year || "";
          }
          if (isSeries && seasonInput && (force || !seasonInput.value)) {
            seasonInput.value = parsed.season || "";
          }
          if (resolutionSel && parsed.resolution) {
            const match = [...resolutionSel.options].find(
              (o) => o.value.toLowerCase() === parsed.resolution.toLowerCase(),
            );
            if (match) resolutionSel.value = match.value;
          }
          if (qualitySel && parsed.quality) qualitySel.value = parsed.quality;
        }

        if (browseBtn && fileBrowse) {
          browseBtn.addEventListener("click", async () => {
            if (!isSeries) {
              fileBrowse.click();
              return;
            }

            let sourceName = "";
            let dirHandle = null;
            if (typeof window.showDirectoryPicker === "function") {
              try {
                dirHandle = await showRememberedSeriesDirectoryPicker();
                sourceName = normalize(dirHandle?.name || "");
              } catch (error) {
                // User cancelled or API unavailable in this context.
              }
            }

            if (!sourceName) {
              // Fallback for browsers without showDirectoryPicker support.
              fileBrowse.click();
              return;
            }

            filenameInput.value = sourceName;
            titleInput.value = "";
            if (yearInput) yearInput.value = "";
            if (seasonInput) seasonInput.value = "";
            applyParsed(sourceName, true);

            // Compute folder size recursively
            if (storageSizeInput && dirHandle) {
              storageSizeInput.value = "...";
              (async () => {
                try {
                  let totalBytes = 0;
                  const sumDir = async (dh) => {
                    for await (const entry of dh.values()) {
                      if (entry.kind === "file") {
                        const f = await entry.getFile();
                        totalBytes += f.size;
                      } else if (entry.kind === "directory") {
                        await sumDir(entry);
                      }
                    }
                  };
                  await sumDir(dirHandle);
                  const gb = totalBytes / (1024 ** 3);
                  storageSizeInput.value = gb >= 0.1 ? gb.toFixed(2) : (totalBytes / (1024 ** 2)).toFixed(0) + " MB";
                } catch (_) {
                  storageSizeInput.value = "";
                }
              })();
            }
          });

          fileBrowse.addEventListener("change", () => {
            const files = fileBrowse.files;
            if (!files || files.length === 0) return;

            const file = files[0];
            let sourceName = "";
            if (isSeries) {
              const rel = file.webkitRelativePath || "";
              sourceName = rel ? rel.split("/")[0] : "";
            } else {
              sourceName = file.name.replace(/\.[^.]+$/, "");
            }
            if (!sourceName) return;

            filenameInput.value = sourceName;
            titleInput.value = "";
            if (yearInput) yearInput.value = "";
            if (seasonInput) seasonInput.value = "";
            applyParsed(sourceName, true);

            // Calculate actual file size from selected files
            if (storageSizeInput && files.length > 0) {
              let totalBytes = 0;
              for (const f of files) totalBytes += f.size;
              const gb = totalBytes / (1024 ** 3);
              storageSizeInput.value = gb >= 0.1 ? gb.toFixed(2) : (totalBytes / (1024 ** 2)).toFixed(0) + " MB";
            }
          });
        }

        if (filenameInput) {
          filenameInput.addEventListener("change", () => {
            applyParsed(filenameInput.value, false);
          });
        }

        if (!isSeries && movieTypeSel) {
          movieTypeSel.addEventListener("change", () => {
            applyMovieTypeStorageRuleToInputs(
              movieTypeSel.value,
              storageCaseSel,
              storageHddSel,
            );
          });
        }

        if (cancelBtn) {
          cancelBtn.addEventListener("click", () => {
            state.isAddingNew = false;
            el.detailsContainer.innerHTML = statusMarkup(
              t("details.selectPrompt"),
            );
            updateDetailsActionButtons();
          });
        }

        if (saveBtn) {
          saveBtn.addEventListener("click", async () => {
            const filename = filenameInput?.value.trim() || "";
            const title = titleInput?.value.trim() || "";
            if (!title && !filename) {
              statusEl.textContent = "Please enter a title or filename.";
              statusEl.style.color = "#ef4444";
              return;
            }
            statusEl.textContent = "Saving\u2026";
            statusEl.style.color = "var(--muted)";
            saveBtn.disabled = true;

            const payload = {
              sheetType: isSeries ? "series" : "movies",
              filename,
              title,
              year: isSeries ? "" : yearInput?.value.trim() || "",
              "Movie Type": isSeries ? "" : movieTypeSel?.value || "",
              resolution: resolutionSel?.value || "",
              Quality: qualitySel?.value || "",
              storageCase: storageCaseSel?.value || "",
              storageHdd: storageHddSel?.value || "",
              storageSize: storageSizeInput?.value.trim() || "",
              Season: isSeries ? seasonInput?.value.trim() || "" : "",
            };

            try {
              const result = await callApi("/api/addMovie", "POST", payload);
              state.isAddingNew = false;
              applyBackendPayload(result);

              if (result.newDocId) {
                const parts = result.newDocId.split("_");
                const newRowIdx = parseInt(parts[parts.length - 1], 10);
                const targetType = isSeries ? "series" : "movies";
                const collection = isSeries ? state.series : state.movies;
                const newItem = collection.find(
                  (m) => Number(m.rowIndex) === newRowIdx,
                );
                if (newItem) {
                  state.searchTerm = "";
                  if (el.searchInput) el.searchInput.value = "";
                  if (el.suggestionsDropdown)
                    el.suggestionsDropdown.classList.remove("show");
                  applyFilterAndRender(true, false);

                  const pageSize = getCurrentPageSize();
                  const itemIdx = state.filtered.findIndex(
                    (i) =>
                      Number(i.rowIndex) === newRowIdx &&
                      i.sheetType === targetType,
                  );
                  if (itemIdx >= 0)
                    state.page = Math.floor(itemIdx / pageSize) + 1;
                  selectItemByKey(newItem.key, { focusContainer: true });
                }
              }
            } catch (error) {
              statusEl.textContent = error.message || "Failed to save.";
              statusEl.style.color = "#ef4444";
              saveBtn.disabled = false;
            }
          });
        }
      }

      function refreshSelectedItemCard(item) {
        const selectedNode = Array.from(
          el.itemsContainer.querySelectorAll(".item"),
        ).find((node) => node.dataset.key === item.key);
        if (!selectedNode) return;

        const titleEl = selectedNode.querySelector(".item-title");
        if (titleEl) {
          if (state.viewMode === "list") {
            const hevcBadge = isHevcQuality(item) ? getHevcBadgeHtml() : "";
            titleEl.innerHTML = `${escapeHtml(item.title || "")}${hevcBadge}`;
          } else {
            titleEl.textContent = item.title || "";

        if (isGridLikeViewMode()) {
          const metaEl = selectedNode.querySelector(".grid-info .item-meta");
          if (metaEl)
            metaEl.textContent = `${item.year || t("values.dash")} • ${item.resolution || t("values.notAvailable")}`;
          const poster = selectedNode.querySelector(".grid-poster");
          if (poster && item.poster) {
            poster.setAttribute("data-poster-url", item.poster);
            poster.setAttribute("data-imdb-id", item.imdbId || "");
            poster.className = "grid-poster placeholder poster-loading";

            loadGridPosters();

            poster.className = "list-poster placeholder poster-loading";
            poster.textContent = t("poster.loading");
            loadListPosters();
          }
        }
      }

      async function renderDetails() {
        if (state.isAddingNew) return;

              .join("");

          }
          if (field === "Quality") {
            const current = normalize(item[field]).toLowerCase();
            const opts = ["", "hevc", "x264"]
              .map((option) => {

          }
          if (field === "storageHdd") {

            if (item.sheetType === "series") {

              return `<input class="detail-input" data-edit-field="storageHdd" value="${escapeHtml(item[field] || "")}" />`;
            } else {
              // Movies: use dropdown with movie storage options
              const opts = ["M01", "M03", "M04", "M05", "M06", "M09", "M10"]
                .map(
                  (option) =>
                    `<option value="${option}"${item[field] === option ? " selected" : ""}>${option}</option>`,
                )
                .join("");
              return `<select class="detail-input" data-edit-field="storageHdd">${opts}</select>`;
            }
          }
          if (field === "storageCase") {
            // Series and movies may have different storage case formats
            if (item.sheetType === "series") {
              // Series: allow text input for values like "SS1", "SS6", etc.
              return `<input class="detail-input" data-edit-field="storageCase" value="${escapeHtml(item[field] || "")}" />`;
            } else {
              // Movies: use dropdown with movie storage case options
              const opts = ["MS1", "MS2", "MS3", "MS4", "MS5"]
                .map(
                  (option) =>
                    `<option value="${option}"${item[field] === option ? " selected" : ""}>${option}</option>`,
                )
                .join("");
              return `<select class="detail-input" data-edit-field="storageCase">${opts}</select>`;
            }
          }
          if (field === "filename" && item.sheetType === "series") {
            return `<div style="display:flex;gap:6px;align-items:center;min-width:0;">
              <input class="detail-input" data-edit-field="filename" value="${escapeHtml(item[field] || "")}" style="flex:1;min-width:0;" />
              <input id="editSeriesFolderBrowse" type="file" style="display:none;" webkitdirectory directory multiple />
              <button id="editSeriesBrowseBtn" class="btn" type="button">Select Folder…</button>
            </div>`;
          }
          if (field === "filename" && item.sheetType !== "series") {
            return `<div style="display:flex;gap:6px;align-items:center;min-width:0;">
              <input class="detail-input" data-edit-field="filename" value="${escapeHtml(item[field] || "")}" style="flex:1;min-width:0;" />
              <input id="editMovieFileBrowse" type="file" style="display:none;" accept=".mkv,.mp4,.avi,.mov,.m4v,.ts,.m2ts,.wmv,.flv,.webm" />
              <button id="editMovieBrowseBtn" class="btn" type="button">Browse…</button>

        // Build detail grid rows conditionally based on sheet type
        const isMovie = item.sheetType === "movies";
        const yearRow = isMovie ? `
							<div class="label">${escapeHtml(t("details.yearOfRelease"))}</div>${valueCell("year")}` : "";
        const seasonRow = !isMovie ? `
      							<div class="label">Season</div>${valueCell("Season")}` : "";

        const movieTypeRow = isMovie ? `
							<div class="label">${escapeHtml(t("details.movieType"))}</div>${valueCell("Movie Type")}` : "";

        const storageSizeRow = `
      							<div class="label">${escapeHtml(t("details.storageSize"))}</div>${valueCell("storageSize")}`;
          const sizePerEpisodeRow = !isMovie ? `
            <div class="label">${escapeHtml(t("details.sizePerEpisode"))}</div>${valueCell("sizeperepisode")}` : "";

        el.detailsContainer.innerHTML = `
				<div class="detail-card">
					<div class="poster-column">
						${posterSlot}
					</div>
					<div class="detail-content">
						<h2 class="detail-title">${escapeHtml(item.title)}</h2>
						<div class="detail-grid">${yearRow}
              <div class="label">${escapeHtml(t("details.filename"))}</div>${valueCell("filename")}${seasonRow}${seasonsRow}${movieTypeRow}
							<div class="label">${escapeHtml(t("details.resolution"))}</div>${valueCell("resolution")}${qualityRow}
							<div class="label">${escapeHtml(t("details.language"))}</div>${valueCell("language")}
							<div class="label">${escapeHtml(t("details.storageCase"))}</div>${valueCell("storageCase")}

                const meta = getMetadataObject(item);
                const rating =
                  meta && meta.imdbRating && meta.imdbRating !== "N/A"
                    ? formatImdbDisplay(meta.imdbRating)
                    : null;

                  meta && meta.imdbVotes && meta.imdbVotes !== "N/A"
                    ? formatImdbDisplay(meta.imdbVotes)

						<div class="detail-side-label">${escapeHtml(t("details.plot"))}</div>

					<div class="api-details-row">

						${
              metadataCollapsed

                  ? `<pre class="json-block">${escapeHtml(item.metadataJson)}</pre>`
                  : `<div class="item-meta">${escapeHtml(t("details.noMetadata"))}</div>`
            }
						<div class="metadata-editor">
							<input id="metadataImdbInput" type="text" value="${escapeHtml(effectiveImdbId)}" placeholder="${escapeHtml(t("details.imdbPlaceholder"))}" />

        if (state.isEditingDetails) {

                      nextValue,

                      storageHddInput,

                      "storageCase",

                      item,
                      "storageHdd",
                      storageHddInput?.value || "",

            setFieldAndInput("resolution", parsed.resolution || "");
            setFieldAndInput("Quality", parsed.quality || "x264");
            setFieldAndInput("storageSize", parsed.storageSize || "");
          };

          const setSeriesStorageSizeFromBytes = (totalBytes) => {
            const bytes = Number(totalBytes || 0);
            if (!Number.isFinite(bytes) || bytes <= 0) return;
            const gb = bytes / (1024 ** 3);
            const sizeValue =
              gb >= 0.1
                ? gb.toFixed(2)
                : (bytes / (1024 ** 2)).toFixed(0) + " MB";
            onDetailFieldInput(item, "storageSize", sizeValue);
            const storageSizeInput = el.detailsContainer.querySelector(
              '[data-edit-field="storageSize"]',
            );
            if (storageSizeInput) storageSizeInput.value = sizeValue;
          };

          if (seriesBrowseBtn && seriesFolderBrowse && item.sheetType === "series") {
            seriesBrowseBtn.addEventListener("click", async () => {
              let sourceName = "";
              let dirHandle = null;
              if (typeof window.showDirectoryPicker === "function") {
                try {
                  dirHandle = await showRememberedSeriesDirectoryPicker();
                  sourceName = normalize(dirHandle?.name || "");
                } catch (_) {
                  // User canceled picker.
                }
              }

              if (!sourceName) {
                seriesFolderBrowse.click();
                return;
              }

              applySeriesFolderSelection(sourceName);

              if (dirHandle) {
                try {
                  let totalBytes = 0;
                  const sumDir = async (dh) => {
                    for await (const entry of dh.values()) {
                      if (entry.kind === "file") {
                        const f = await entry.getFile();
                        totalBytes += f.size;
                      } else if (entry.kind === "directory") {
                        await sumDir(entry);
                      }
                    }
                  };
                  await sumDir(dirHandle);
                  setSeriesStorageSizeFromBytes(totalBytes);
                } catch (_) {
                  // Keep parsed storage size when folder traversal is blocked.
                }
              }
            });

            seriesFolderBrowse.addEventListener("change", () => {
              const files = seriesFolderBrowse.files;
              if (!files || files.length === 0) return;
              const rel = files[0].webkitRelativePath || "";
              const sourceName = rel ? rel.split("/")[0] : "";
              applySeriesFolderSelection(sourceName);

              let totalBytes = 0;
              for (const f of files) totalBytes += f.size;
              setSeriesStorageSizeFromBytes(totalBytes);
            });
          }

          if (seriesFilenameInput && item.sheetType === "series") {
            const autoFillFromTypedFilename = () => {
              applySeriesFolderSelection(seriesFilenameInput.value || "", {
                setFilename: false,
              });
            };
            seriesFilenameInput.addEventListener("input", autoFillFromTypedFilename);
            seriesFilenameInput.addEventListener("change", autoFillFromTypedFilename);
          }

          if (item.sheetType !== "series") {
            const movieBrowseBtn = el.detailsContainer.querySelector("#editMovieBrowseBtn");
            const movieFileBrowse = el.detailsContainer.querySelector("#editMovieFileBrowse");

            const applyMovieFileSelection = (file) => {
              if (!file) return;
              const nameNoExt = file.name.replace(/\.[^.]+$/, "");
              const parsed = parseMovieFilenameForForm(nameNoExt);

              const setFieldAndInput = (field, value) => {
                if (!normalize(value)) return;
                onDetailFieldInput(item, field, value);
                const inputNode = el.detailsContainer.querySelector(
                  `[data-edit-field="${field}"]`,
                );
                if (inputNode) inputNode.value = value;
              };

              setFieldAndInput("filename", nameNoExt);
              setFieldAndInput("resolution", parsed.resolution || "");
              setFieldAndInput("Quality", parsed.quality || "");

              const bytes = file.size || 0;
              if (bytes > 0) {
                const gb = bytes / (1024 ** 3);
                const sizeValue =
                  gb >= 0.1
                    ? gb.toFixed(2)
                    : (bytes / (1024 ** 2)).toFixed(0) + " MB";
                setFieldAndInput("storageSize", sizeValue);
              }
            };

            if (movieBrowseBtn && movieFileBrowse) {
              movieBrowseBtn.addEventListener("click", async () => {
                if (typeof window.showOpenFilePicker === "function") {
                  try {
                    const handle = await showRememberedMovieFilePicker();
                    if (handle) {
                      const file = await handle.getFile();
                      applyMovieFileSelection(file);
                      return;
                    }
                  } catch (_) {
                    // User canceled or API unavailable — fall through to input.
                  }
                }
                movieFileBrowse.click();
              });

              movieFileBrowse.addEventListener("change", () => {
                const files = movieFileBrowse.files;
                if (!files || files.length === 0) return;
                applyMovieFileSelection(files[0]);
              });
            }
          }
        }

        el.detailsContainer
          .querySelectorAll("[data-season-key]")
          .forEach((node) => {
            node.addEventListener("click", (event) => {
              event.preventDefault();
              event.stopPropagation();
              const seasonKey = node.getAttribute("data-season-key");
              if (!seasonKey || seasonKey === state.selectedKey) return;
              selectItemByKey(seasonKey, { focusContainer: true });
            });
          });

        // Kick off async poster load + cache (does not block UI)
        if (hasPoster) {
          loadAndCachePoster(item.poster, selectedKeyAtStart, item.imdbId);
        }

        wireMetadataActions(item);
        updateDetailsActionButtons();
      }

      function beginPageLock() {
        const lock = {
          page: state.page,
          selectedKey: state.selectedKey,
        };
        state.pageLock = lock;
        return lock;
      }

      function restorePageLock(lock = state.pageLock) {
        if (!lock) return;
        const pages = totalPages();
        state.page = Math.min(Math.max(1, lock.page), pages);
        state.selectedKey = lock.selectedKey;
      }

      function endPageLock(lock = state.pageLock) {
        if (!lock) return;
        if (state.pageLock === lock) {
          state.pageLock = null;
        }
      }

      function updateAddButtonUi() {
        if (!el.addMovieBtn) return;
        el.addMovieBtn.style.display = "";
        const isSeries = state.activeTab === "series";
        el.addMovieBtn.title = isSeries ? "Add new series" : "Add new movie";
        el.addMovieBtn.setAttribute("aria-label", el.addMovieBtn.title);
      }

      function setActiveTab(tab) {
        if (IS_TAB_LOCKED && tab !== state.activeTab) return;
        state.isAddingNew = false;
        state.activeTab = tab;
        state.viewMode = normalizeViewModeForTab(tab, state.viewMode);
        localStorage.setItem(UI_ACTIVE_TAB_STORAGE_KEY, tab);
        localStorage.setItem(UI_VIEW_MODE_STORAGE_KEY, state.viewMode);
        state.page = getPersistedPage(tab);
        state.searchTerm = "";
        el.searchInput.value = "";
        state.isMetadataCollapsed = true;
        state.xlFilters = {};
        restorePersistedSelectionForTab(tab);
        state.selectedItemKeys.clear();

        el.tabMovies.classList.toggle("active", tab === "movies");
        el.tabSeries.classList.toggle("active", tab === "series");
        el.listViewBtn.classList.toggle("primary", state.viewMode === "list");
        el.gridViewBtn.classList.toggle("primary", state.viewMode === "grid");
        el.compressedViewBtn.style.display = tab === "series" ? "" : "none";
        el.compressedViewBtn.classList.toggle(
          "primary",
          state.viewMode === "compressed",
        );
        updateAddButtonUi();

        applyFilterAndRender(false, true);
      }

      function setViewMode(mode) {
        const nextMode = normalizeViewModeForTab(state.activeTab, mode);
        state.viewMode = nextMode;
        localStorage.setItem(UI_VIEW_MODE_STORAGE_KEY, nextMode);
        el.listViewBtn.classList.toggle("primary", nextMode === "list");
        el.gridViewBtn.classList.toggle("primary", nextMode === "grid");
        el.compressedViewBtn.classList.toggle("primary", nextMode === "compressed");

        applyFilterAndRender(false, false);

        // Recalculate page so the currently selected item is visible in the new view mode.
        if (state.selectedKey) {
          const pageSize = getCurrentPageSize(nextMode);
          const globalIdx = state.filtered.findIndex((i) => i.key === state.selectedKey);
          if (globalIdx >= 0) {
            state.page = Math.floor(globalIdx / pageSize) + 1;
          }
        }

        render();
        renderDetails();
        scrollSelectedItemIntoView();
      }

      // ── XL Spreadsheet View ───────────────────────────────────────────────

      const XL_MOVIE_COLUMNS = [
        { key: "title",       label: "Title"        },
        { key: "filename",    label: "Filename"      },
        { key: "resolution",  label: "Resolution"    },
        { key: "year",        label: "Year"          },
        { key: "_rating",     label: "Ratings"       },
        { key: "_quality",    label: "Quality"       },
        { key: "_reload",     label: "Reload"        },
        { key: "storageCase", label: "Storage Case"  },
        { key: "storageHdd",  label: "Storage HDD"   },
        { key: "storageSize", label: "Storage Size"  },
      ];

      const XL_SERIES_COLUMNS = [
        { key: "title",       label: "Title"        },
        { key: "filename",    label: "Filename"      },
        { key: "resolution",  label: "Resolution"    },
        { key: "sizeperepisode", label: "Size / Episode" },
        { key: "_rating",     label: "Ratings"       },
        { key: "_quality",    label: "Quality"       },
        { key: "_reload",     label: "Reload"        },
        { key: "storageCase", label: "Storage Case"  },
        { key: "storageHdd",  label: "Storage HDD"   },
        { key: "storageSize", label: "Storage Size"  },
        { key: "Season",      label: "Season"        },
      ];

      function getXlColumns() {
        return state.activeTab === "movies" ? XL_MOVIE_COLUMNS : XL_SERIES_COLUMNS;
      }

      function getXlCellValue(item, key) {
        if (key === "_quality") return getDisplayQuality(item);
        if (key === "_rating") {
          const meta = getMetadataObject(item);
          const imdb = formatImdbDisplay(meta?.imdbRating);
          return imdb && imdb !== "N/A" ? imdb : t("values.dash");
        }
        if (key === "_reload") return "";
        return normalize(item[key]);
      }

      function hasActiveXlFilters() {
        return Object.values(state.xlFilters).some((v) => normalize(v) !== "");
      }

      function parseSortableValue(rawValue) {
        const value = normalize(rawValue);
        if (!value) return { type: "empty", value: "" };

        const compact = value.replace(/,/g, "").trim();
        if (/^-?\d+(\.\d+)?$/.test(compact)) {
          return { type: "number", value: Number(compact) };
        }

        const parsedDate = Date.parse(value);
        if (!Number.isNaN(parsedDate) && /\d/.test(value)) {
          return { type: "date", value: parsedDate };
        }

        return { type: "text", value: value.toLowerCase() };
      }

      function compareXlRows(a, b, sortKey, direction) {
        const aParsed = parseSortableValue(getXlCellValue(a, sortKey));
        const bParsed = parseSortableValue(getXlCellValue(b, sortKey));

        let result = 0;
        if (aParsed.type === "empty" && bParsed.type !== "empty") {
          result = 1;
        } else if (aParsed.type !== "empty" && bParsed.type === "empty") {
          result = -1;
        } else if (
          (aParsed.type === "number" || aParsed.type === "date") &&
          aParsed.type === bParsed.type
        ) {
          result = aParsed.value - bParsed.value;
        } else {
          result = String(aParsed.value).localeCompare(String(bParsed.value));
        }

        if (result === 0) {
          // Keep sorting deterministic for equal cells.
          result = normalize(a.key).localeCompare(normalize(b.key));
        }
        return direction === "desc" ? -result : result;
      }

      function getSortIndicator(colKey) {
        if (state.xlSort.key !== colKey) return "↕";
        return state.xlSort.direction === "desc" ? "↓" : "↑";
      }

      function toggleXlSort(colKey) {
        if (state.xlSort.key === colKey) {
          state.xlSort.direction = state.xlSort.direction === "asc" ? "desc" : "asc";
        } else {
          state.xlSort.key = colKey;
          state.xlSort.direction = "asc";
        }
        renderXlView();
      }

      function renderXlView() {
        const container = el.xlViewContainer;
        if (!container) return;

        const columns = getXlColumns();
        const filters = state.xlFilters;
        const sortableColumns = columns.filter((col) => col.key !== "_reload");
        const hasSortColumn = sortableColumns.some((col) => col.key === state.xlSort.key);
        if (!hasSortColumn) {
          state.xlSort = { key: sortableColumns[0]?.key || null, direction: "asc" };
        }

        // Base: search-filtered items; then apply per-column filters on top.
        let rows = state.filtered;
        columns.forEach((col) => {
          if (col.key === "_reload") return;
          const f = normalize(filters[col.key] || "").toLowerCase();
          if (!f) return;
          rows = rows.filter((item) =>
            getXlCellValue(item, col.key).toLowerCase().includes(f),
          );
        });

        if (state.xlSort.key) {
          rows = [...rows].sort((a, b) =>
            compareXlRows(a, b, state.xlSort.key, state.xlSort.direction),
          );
        }

        const headerCells = columns
          .map((col) => {
            if (col.key === "_reload") {
              return `<th>${escapeHtml(col.label)}</th>`;
            }
            const sortIndicator = getSortIndicator(col.key);
            const isActive = state.xlSort.key === col.key;
            const nextDirection =
              isActive && state.xlSort.direction === "asc" ? "descending" : "ascending";
            return `<th><button class="xl-sort-btn${isActive ? " active" : ""}" type="button" data-sort-col="${escapeHtml(col.key)}" title="Sort ${escapeHtml(col.label)} ${nextDirection}">${escapeHtml(col.label)} <span class="xl-sort-indicator">${sortIndicator}</span></button></th>`;
          })
          .join("");

        const filterCells = columns
          .map(
            (col) =>
              col.key === "_reload"
                ? `<th></th>`
                : `<th><input class="xl-filter-input" type="text" placeholder="Filter\u2026" data-col="${escapeHtml(col.key)}" value="${escapeHtml(normalize(filters[col.key] || ""))}" /></th>`,
          )
          .join("");

        const bodyRows = rows
          .map((item, idx) => {
            const cells = columns
              .map((col) => {
                if (col.key === "_quality") {
                  const storedQuality = getStoredQuality(item);
                  const currentQuality =
                    storedQuality === "hevc" || storedQuality === "x264"
                      ? storedQuality
                      : "";
                  const qualityOpts = [
                    { value: "", label: "-" },
                    { value: "hevc", label: "hevc" },
                    { value: "x264", label: "x264" },
                  ]
                    .map(
                      (opt) =>
                        `<option value="${opt.value}"${currentQuality === opt.value ? " selected" : ""}>${opt.label}</option>`,
                    )
                    .join("");
                  return `<td><select class="xl-quality-select" data-row-key="${escapeHtml(item.key)}">${qualityOpts}</select></td>`;
                }
                if (col.key === "_reload") {
                  return `<td><button class="xl-row-action-btn xl-reload-btn" type="button" data-row-key="${escapeHtml(item.key)}">Reload</button></td>`;
                }
                if (col.key === "sizeperepisode") {
                  const currentValue = normalize(getXlCellValue(item, col.key));
                  if (!currentValue) {
                    return `<td><input class="xl-filter-input xl-sizeperepisode-input" type="text" inputmode="decimal" placeholder="MB" data-row-key="${escapeHtml(item.key)}" value="" /></td>`;
                  }
                }
                return `<td title="${escapeHtml(getXlCellValue(item, col.key))}">${escapeHtml(getXlCellValue(item, col.key))}</td>`;
              })
              .join("");
            return `<tr><td>${idx + 1}</td>${cells}</tr>`;
          })
          .join("");

        const clearBtn = hasActiveXlFilters()
          ? `<button class="xl-clear-filters-btn" id="xlClearFiltersBtn">Clear Filters</button>`
          : "";
        const saveBtn = `<button class="xl-save-btn" id="xlSaveChangesBtn"${state.hasUnsavedChanges ? "" : " disabled"}>Save</button>`;

        container.innerHTML = `
          <div class="xl-table-wrap">
            <table class="xl-table">
              <thead>
                <tr class="xl-header-row"><th></th>${headerCells}</tr>
                <tr class="xl-filter-row"><th></th>${filterCells}</tr>
              </thead>
              <tbody>${bodyRows || `<tr><td colspan="${columns.length + 1}" style="text-align:center;padding:24px;color:var(--muted);">No items match the current filters.</td></tr>`}</tbody>
            </table>
          </div>
          <div class="xl-count-bar">
            <span>Showing <strong>${rows.length}</strong> of <strong>${state.filtered.length}</strong> item${state.filtered.length !== 1 ? "s" : ""}</span>
            <span class="xl-actions">${saveBtn}${clearBtn}</span>
          </div>`;

        // Attach per-column filter input handlers (preserve scroll position).
        container.querySelectorAll(".xl-filter-input").forEach((input) => {
          input.addEventListener("input", () => {
            const wrap = container.querySelector(".xl-table-wrap");
            const scrollTop = wrap ? wrap.scrollTop : 0;
            state.xlFilters[input.dataset.col] = input.value;
            renderXlView();
            const newWrap = container.querySelector(".xl-table-wrap");
            if (newWrap) newWrap.scrollTop = scrollTop;
            // Re-focus the changed input (same column).
            const refocused = container.querySelector(
              `.xl-filter-input[data-col="${input.dataset.col}"]`,
            );
            if (refocused) {
              refocused.focus();
              const len = refocused.value.length;
              refocused.setSelectionRange(len, len);
            }
          });
        });

        const clearFiltersBtn = document.getElementById("xlClearFiltersBtn");
        if (clearFiltersBtn) {
          clearFiltersBtn.addEventListener("click", () => {
            state.xlFilters = {};
            renderXlView();
          });
        }

        container.querySelectorAll(".xl-sort-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const colKey = btn.dataset.sortCol;
            if (!colKey) return;
            toggleXlSort(colKey);
          });
        });

        container.querySelectorAll(".xl-quality-select").forEach((select) => {
          select.addEventListener("change", () => {
            const targetKey = select.dataset.rowKey;
            if (!targetKey) return;
            const targetItem = getActiveData().find((item) => item.key === targetKey);
            if (!targetItem) return;
            const wrap = container.querySelector(".xl-table-wrap");
            const scrollTop = wrap ? wrap.scrollTop : 0;
            onDetailFieldInput(targetItem, "Quality", select.value);
            renderXlView();
            const newWrap = container.querySelector(".xl-table-wrap");
            if (newWrap) newWrap.scrollTop = scrollTop;
          });
        });

        container.querySelectorAll(".xl-sizeperepisode-input").forEach((input) => {
          input.addEventListener("change", () => {
            const targetKey = input.dataset.rowKey;
            if (!targetKey) return;
            const targetItem = getActiveData().find((item) => item.key === targetKey);
            if (!targetItem) return;
            if (normalize(targetItem.sizeperepisode)) return;
            const wrap = container.querySelector(".xl-table-wrap");
            const scrollTop = wrap ? wrap.scrollTop : 0;
            const normalizedValue = normalize(input.value);
            onDetailFieldInput(targetItem, "sizeperepisode", normalizedValue);
            renderXlView();
            const newWrap = container.querySelector(".xl-table-wrap");
            if (newWrap) newWrap.scrollTop = scrollTop;
          });
        });

        container.querySelectorAll(".xl-reload-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const targetKey = btn.dataset.rowKey;
            if (!targetKey) return;
            const targetItem = getActiveData().find((item) => item.key === targetKey);
            if (!targetItem) return;
            const wrap = container.querySelector(".xl-table-wrap");
            const scrollTop = wrap ? wrap.scrollTop : 0;
            btn.disabled = true;
            btn.textContent = "Reloading...";
            const pageLock = beginPageLock();
            try {
              await fetchLatestMetadataForItem(targetItem, null, {
                refreshUi: false,
                externalPageLock: pageLock,
              });
              restorePageLock(pageLock);
              renderXlView();
              render();
              renderDetails();
              const newWrap = container.querySelector(".xl-table-wrap");
              if (newWrap) newWrap.scrollTop = scrollTop;
            } catch (error) {
              btn.disabled = false;
              btn.textContent = "Reload";
              alert(error?.message || t("fetch.failed"));
            } finally {
              endPageLock(pageLock);
            }
          });
        });

        const saveChangesBtn = document.getElementById("xlSaveChangesBtn");
        if (saveChangesBtn) {
          saveChangesBtn.addEventListener("click", async () => {
            flushDetailFormEdits();
            if (!state.hasUnsavedChanges) return;
            const pageLock = beginPageLock();
            state.suppressNextPageReset = true;
            try {
              await saveWorkbookToFile({
                quiet: true,
                refreshDetails: false,
                exitEditMode: false,
                preservedPage: pageLock.page,
                preservedSelection: pageLock.selectedKey,
              });
              restorePageLock(pageLock);
              renderXlView();
              render();
              renderDetails();
            } finally {
              endPageLock(pageLock);
              setTimeout(() => {
                state.suppressNextPageReset = false;
              }, 0);
            }
          });
        }
      }

      function setXlView(enabled) {
        state.xlView = !!enabled;
        localStorage.setItem(
          UI_XL_VIEW_STORAGE_KEY,
          state.xlView ? "true" : "false",
        );
        if (el.xlViewToggle) el.xlViewToggle.checked = state.xlView;
        const layout = document.querySelector(".layout");
        if (layout) layout.style.display = state.xlView ? "none" : "";
        if (el.xlViewContainer) {
          el.xlViewContainer.style.display = state.xlView ? "flex" : "none";
        }
        if (state.xlView) renderXlView();
      }

      function bindEvents() {
        document.addEventListener("keydown", (event) => {
          if (
            !["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(
              event.key,
            )
          )
            return;
          if (state.isEditingDetails || isInteractiveElement(event.target))
            return;
          if (moveSelectionWithArrow(event.key)) {
            event.preventDefault();
          }
        });

        if (!IS_TAB_LOCKED) {
          el.tabMovies.addEventListener("click", () => setActiveTab("movies"));
          el.tabSeries.addEventListener("click", () => setActiveTab("series"));
        }

        if (el.fetchAllMetadataBtn) {
          el.fetchAllMetadataBtn.addEventListener("click", async () => {
            await fetchAllMissingMetadataForSelectedOnPage();
          });
        }

        if (el.deleteSelectedBtn) {
          el.deleteSelectedBtn.addEventListener("click", async () => {
            await deleteSelectedItemsOnCurrentPage();
          });
        }

        if (el.addMovieBtn) {
          el.addMovieBtn.addEventListener("click", () => {
            state.isAddingNew = true;
            state.selectedKey = null;
            state.isEditingDetails = false;
            renderAddNewPanel();
            updateDetailsActionButtons();
          });
        }

        if (el.selectAllPageBtn) {
          el.selectAllPageBtn.addEventListener("click", () => {
            selectAllItemsOnCurrentPage();
          });
        }

        el.listViewBtn.addEventListener("click", () => setViewMode("list"));
        el.gridViewBtn.addEventListener("click", () => setViewMode("grid"));
        el.compressedViewBtn.addEventListener("click", () =>
          setViewMode("compressed"),
        );

        if (el.xlViewToggle) {
          el.xlViewToggle.addEventListener("change", () => {
            setXlView(el.xlViewToggle.checked);
          });
        }

        el.detailEditBtn.addEventListener("click", () => {
          if (!getSelectedItem()) return;
          setEditMode(true);
        });

        el.detailSaveBtn.addEventListener("click", async () => {
          flushDetailFormEdits();
          if (!state.hasUnsavedChanges) return;
          const pageLock = beginPageLock();
          state.suppressNextPageReset = true;
          try {
            await saveWorkbookToFile({
              preservedPage: pageLock.page,
              preservedSelection: pageLock.selectedKey,
            });
            restorePageLock(pageLock);
            render();
            renderDetails();
          } finally {
            endPageLock(pageLock);
            setTimeout(() => {
              state.suppressNextPageReset = false;
            }, 0);
          }
        });

        el.detailCancelBtn.addEventListener("click", async () => {
          if (state.hasUnsavedChanges) {
            const ok = confirm(t("confirm.discardUnsaved"));
            if (!ok) return;
            await loadWorkbook();
          }
          state.isEditingDetails = false;
          updateDetailsActionButtons();
          renderDetails();
        });

        el.searchInput.addEventListener("input", () => {
          generateSuggestions(el.searchInput.value);
        });

        if (el.titleOnlyCheckbox) {
          el.titleOnlyCheckbox.checked = !!state.titleOnlySearch;
          el.titleOnlyCheckbox.addEventListener("change", () => {
            state.titleOnlySearch = !!el.titleOnlyCheckbox.checked;
            localStorage.setItem(
              UI_TITLE_ONLY_STORAGE_KEY,
              state.titleOnlySearch ? "true" : "false",
            );
            generateSuggestions(el.searchInput.value);
            applyFilterAndRender(true);
          });
        }

        el.searchInput.addEventListener("keydown", (event) => {
          if (event.key === "ArrowDown" && state.suggestions.length) {
            event.preventDefault();
            state.activeSuggestionIndex = Math.min(
              state.activeSuggestionIndex + 1,
              state.suggestions.length - 1,
            );
            renderSuggestions();
          } else if (event.key === "ArrowUp" && state.suggestions.length) {
            event.preventDefault();
            state.activeSuggestionIndex = Math.max(
              state.activeSuggestionIndex - 1,
              -1,
            );
            renderSuggestions();
          } else if (event.key === "Enter") {
            if (state.activeSuggestionIndex >= 0 && state.suggestions.length) {
              el.searchInput.value =
                state.suggestions[state.activeSuggestionIndex];
              state.searchTerm = el.searchInput.value;
              el.suggestionsDropdown.classList.remove("show");
              applyFilterAndRender(true);
            } else {
              state.searchTerm = el.searchInput.value;
              el.suggestionsDropdown.classList.remove("show");
              applyFilterAndRender(true);
            }
          } else if (event.key === "Escape") {
            el.suggestionsDropdown.classList.remove("show");
          }
        });

        el.searchBtn.addEventListener("click", () => {
          state.searchTerm = el.searchInput.value;
          el.suggestionsDropdown.classList.remove("show");
          applyFilterAndRender(true);
        });

        el.clearBtn.addEventListener("click", () => {
          state.searchTerm = "";
          el.searchInput.value = "";
          el.suggestionsDropdown.classList.remove("show");
          applyFilterAndRender(true);
        });

        // Hide suggestions when clicking outside
        document.addEventListener("click", (e) => {
          if (
            e.target !== el.searchInput &&
            !el.suggestionsDropdown.contains(e.target)
          ) {
            el.suggestionsDropdown.classList.remove("show");
          }
        });

        el.firstBtn.addEventListener("click", () => {
          navigateToPage(1);
        });

        el.prevBtn.addEventListener("click", () => {
          navigateToPage(state.page - 1);
        });

        el.nextBtn.addEventListener("click", () => {
          navigateToPage(state.page + 1);
        });

        el.lastBtn.addEventListener("click", () => {
          navigateToPage(totalPages());
        });

        const jumpToTypedPage = () => {
          const pages = totalPages();
          const raw = Number(el.gotoPageInput.value || 0);
          if (!raw || Number.isNaN(raw)) return;
          navigateToPage(Math.min(Math.max(1, Math.floor(raw)), pages));
        };

        el.itemsContainer.addEventListener(
          "wheel",
          (event) => {
            const pages = totalPages();
            if (pages <= 1) return;
            if (
              Math.abs(event.deltaY) < Math.abs(event.deltaX) ||
              Math.abs(event.deltaY) < 8
            )
              return;

            const delta = event.deltaY > 0 ? 1 : -1;
            const target = Math.min(Math.max(1, state.page + delta), pages);
            if (target === state.page) return;

            const now = Date.now();
            if (now - state.lastWheelPageNavAt < 220) {
              event.preventDefault();
              return;
            }

            state.lastWheelPageNavAt = now;
            event.preventDefault();
            navigateToPage(target);
          },
          { passive: false },
        );

        el.gotoPageBtn.addEventListener("click", jumpToTypedPage);
        el.gotoPageInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            jumpToTypedPage();
          }
        });
      }

      function installSeriesSizePerEpisodeAutoCalc() {
        const VIDEO_EXTS = new Set([
          "mkv", "mp4", "avi", "mov", "m4v", "ts", "m2ts", "wmv", "flv", "webm",
        ]);

        const isVideo = (name) => {
          const n = normalize(name || "").toLowerCase();
          const dot = n.lastIndexOf(".");
          if (dot < 0 || dot === n.length - 1) return false;
          return VIDEO_EXTS.has(n.slice(dot + 1));
        };

        const formatStorageFromBytes = (bytes) => {
          const b = Number(bytes || 0);
          if (!Number.isFinite(b) || b <= 0) return "";
          const gb = b / (1024 ** 3);
          return gb >= 0.1 ? gb.toFixed(2) : `${(b / (1024 ** 2)).toFixed(0)} MB`;
        };

        const formatSizePerEpisodeMb = (bytes, videoCount) => {
          const b = Number(bytes || 0);
          const c = Number(videoCount || 0);
          if (!Number.isFinite(b) || b <= 0 || !Number.isFinite(c) || c <= 0) return "";
          return (b / c / (1024 ** 2)).toFixed(1);
        };

        const calcMetrics = (fileList) => {
          let totalBytes = 0;
          let videoCount = 0;
          for (const f of fileList || []) {
            totalBytes += Number(f.size || 0);
            if (isVideo(f.name || "")) videoCount += 1;
          }
          return {
            storageSize: formatStorageFromBytes(totalBytes),
            sizePerEpisode: formatSizePerEpisodeMb(totalBytes, videoCount),
          };
        };

        const ensureAddPanelSizeInput = () => {
          let input = document.getElementById("addNewSizePerEpisode");
          if (input) return input;

          const storageInput = document.getElementById("addNewStorageSize");
          if (!storageInput) return null;
          const grid = storageInput.closest(".detail-grid");
          if (!grid) return null;

          storageInput.insertAdjacentHTML(
            "afterend",
            '<div class="label">Size / Episode (MB)</div><input id="addNewSizePerEpisode" class="detail-input" type="text" placeholder="e.g. 512.4" readonly />',
          );
          return document.getElementById("addNewSizePerEpisode");
        };

        document.addEventListener(
          "click",
          (event) => {
            const addBtn = event.target.closest("#addNewBrowseBtn");
            if (addBtn && state.activeTab === "series") {
              const addBrowse = document.getElementById("addNewFileBrowse");
              if (addBrowse) {
                event.preventDefault();
                event.stopImmediatePropagation();
                addBrowse.click();
                return;
              }
            }

            const editBtn = event.target.closest("#editSeriesBrowseBtn");
            if (editBtn) {
              const editBrowse = document.getElementById("editSeriesFolderBrowse");
              if (editBrowse) {
                event.preventDefault();
                event.stopImmediatePropagation();
                editBrowse.click();
              }
            }
          },
          true,
        );

        document.addEventListener("change", (event) => {
          if (event.target && event.target.id === "addNewFileBrowse") {
            const files = event.target.files;
            if (!files || files.length === 0 || state.activeTab !== "series") return;
            const metrics = calcMetrics(files);

            const storageInput = document.getElementById("addNewStorageSize");
            if (storageInput) storageInput.value = metrics.storageSize;

            const sizeInput = ensureAddPanelSizeInput();
            if (sizeInput) sizeInput.value = metrics.sizePerEpisode;
            return;
          }

          if (event.target && event.target.id === "editSeriesFolderBrowse") {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            const selected = getSelectedItem();
            if (!selected || selected.sheetType !== "series") return;

            const metrics = calcMetrics(files);
            onDetailFieldInput(selected, "storageSize", metrics.storageSize);
            onDetailFieldInput(selected, "sizeperepisode", metrics.sizePerEpisode);

            const storageInput = el.detailsContainer.querySelector('[data-edit-field="storageSize"]');
            if (storageInput) storageInput.value = metrics.storageSize;
            const perEpInput = el.detailsContainer.querySelector('[data-edit-field="sizeperepisode"]');
            if (perEpInput) perEpInput.value = metrics.sizePerEpisode;
          }
        });

        if (!window.__patchedAddMovieSizePerEpisode) {
          window.__patchedAddMovieSizePerEpisode = true;
          const originalCallApi = callApi;
          callApi = async function (endpoint, method = "GET", data = null) {
            if (
              endpoint === "/api/addMovie" &&
              method === "POST" &&
              data &&
              data.sheetType === "series"
            ) {
              const sizeInput = document.getElementById("addNewSizePerEpisode");
              if (sizeInput && !normalize(data.sizeperepisode || "")) {
                data.sizeperepisode = normalize(sizeInput.value || "");
              }
            }
            return originalCallApi(endpoint, method, data);
          };
        }
      }
      async function initApp() {
        try {
          console.log("Starting app initialization...");
          await waitForBackendReady();
          await loadUiResources();
          applyStaticStrings();
          applyTabModeUi();

          // Apply active-tab visuals without triggering render/persistence before data is loaded.
          el.tabMovies.classList.toggle("active", state.activeTab === "movies");
          el.tabSeries.classList.toggle("active", state.activeTab === "series");
          updateAddButtonUi();

          bindEvents();
          el.listViewBtn.classList.toggle("primary", state.viewMode === "list");
          el.gridViewBtn.classList.toggle("primary", state.viewMode === "grid");
          el.compressedViewBtn.style.display =
            state.activeTab === "series" ? "" : "none";
          el.compressedViewBtn.classList.toggle(
            "primary",
            state.viewMode === "compressed",
          );
          // Restore persisted XL view state on startup.
          setXlView(state.xlView);
          updateDetailsActionButtons();
          console.log("Backend ready, loading workbook...");
          await loadWorkbook();
          console.log("Workbook loaded successfully");
        } catch (error) {
          const msg =
            error?.message || String(error) || t("status.unknownInitError");
          console.error("Init error:", msg, error);
          el.itemsContainer.innerHTML = `<div class="status" style="color: #ef4444; padding: 20px; white-space: pre-wrap; word-break: break-word; font-family: monospace; font-size: 12px;">${escapeHtml(t("status.errorPrefix", { message: msg }))}</div>`;
          el.countInfo.textContent = t("collection.zeroItems");
        }
      }

      installSeriesSizePerEpisodeAutoCalc();
      initApp();
    </script>
  </body>
